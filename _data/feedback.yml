- text: Massive thanks for volunteering as a coach and spending a full day of your time at the workshop today! Thank you for all your patience and enthusiasm throughout the event and for making today a special day for your attendees. We'd also like to take the time to thank you for presenting a coach talk at the event. It was really heartwarming to see our attendees asking loads of questions at the end of the coach talks, and thank you for proving helpful and eloquent answers to their queries! We hope you will consider coaching at a Django Girls event again. 

  organiser: DjangoGirls PyConUK 2025
  link: https://djangogirls.org/en/pyconuk/
