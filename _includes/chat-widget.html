<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
  :root { --agent-accent: #7BA661; }

  #agent-btn{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;
    border:0;background:var(--agent-accent);color:#fff;font-size:24px;cursor:pointer;z-index:9999;
    display:flex;align-items:center;justify-content:center}
  #agent-btn:hover{filter:brightness(1.08)}
  #agent-box{position:fixed;right:20px;bottom:90px;width:320px;height:420px;display:none;
    flex-direction:column;background:#fff;border:1px solid #ccc;border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:9999;font:14px sans-serif;color:#111}
  #agent-log{flex:1;overflow-y:auto;padding:10px}
  .agent-msg{margin:6px 0;padding:8px 10px;border-radius:8px;max-width:85%;white-space:pre-wrap}
  .agent-user{background:var(--agent-accent);color:#fff;margin-left:auto}
  .agent-bot{background:#f1f1f1}
  #agent-form{display:flex;border-top:1px solid #ddd}
  #agent-input{flex:1;border:0;padding:10px;outline:none}
  #agent-form button{border:0;background:none;padding:0 14px;cursor:pointer;color:var(--agent-accent);font-weight:bold}
  
  .agent-typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px}
  .agent-typing span{width:7px;height:7px;border-radius:50%;background:#888;
    animation:agent-bounce 1.2s infinite ease-in-out}
  .agent-typing span:nth-child(2){animation-delay:.15s}
  .agent-typing span:nth-child(3){animation-delay:.3s}
  @keyframes agent-bounce{
    0%,60%,100%{transform:translateY(0);opacity:.4}
    30%{transform:translateY(-5px);opacity:1}
  }
</style>

<button id="agent-btn" aria-label="Open chat"><i class="bi bi-chat-dots-fill"></i></button>
<div id="agent-box">
  <div id="agent-log"></div>
  <form id="agent-form">
    <input id="agent-input" placeholder="Ask a question…" autocomplete="off" required>
    <button type="submit">Send</button>
  </form>
</div>

<script>
(() => {
  const API = "https://entrypoint.tech/chat";
  const btn = document.getElementById("agent-btn");
  const box = document.getElementById("agent-box");
  const log = document.getElementById("agent-log");
  const form = document.getElementById("agent-form");
  const input = document.getElementById("agent-input");
  const history = [];

  function add(role, text) {
    const d = document.createElement("div");
    d.className = "agent-msg " + (role === "user" ? "agent-user" : "agent-bot");
    d.textContent = text;               // textContent = no HTML injection
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  
  function addTyping() {
    const d = add("bot", "");
    const t = document.createElement("span");
    t.className = "agent-typing";
    t.innerHTML = "<span></span><span></span><span></span>";
    d.appendChild(t);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  btn.onclick = () => {
    const open = box.style.display === "flex";
    box.style.display = open ? "none" : "flex";
    btn.innerHTML = open
      ? '<i class="bi bi-chat-dots-fill"></i>'
      : '<i class="bi bi-x-lg"></i>';
    if (!open && !log.children.length) add("bot", "Hi! I'm Ola, an AI assistant.");
  };

  form.onsubmit = async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
	input.disabled = true;
    add("user", text);
    const pending = addTyping();
    try {
      const r = await fetch(API, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: text, history})
      });
      const data = await r.json();
      pending.textContent = data.reply;
      history.push({role: "user", content: text}, {role: "assistant", content: data.reply});
    } catch (err) {
      pending.textContent = "Assistant is currently offline. Everyone deserve a break ;-)";
    } finally {
      input.disabled = false;
      input.focus();
    }
  };
})();
</script>
